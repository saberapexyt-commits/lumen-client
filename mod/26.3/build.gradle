plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.lumen'
base { archivesName = "lumen-client-mc${project.minecraft_version}" }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.x is unobfuscated: no mappings and no "mod" configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    // 26.x draws its panorama from the vanilla path, so override it with the Lumen panorama
    from('../common/assets/lumen/textures/gui/panorama') { into 'assets/minecraft/textures/gui/title/background' }
}

// shared textures/lang live in ../common/assets (generated by scripts/make-theme.js)
sourceSets.main.resources.srcDir '../common'
sourceSets.main.resources.srcDir '../logo-modern'

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
