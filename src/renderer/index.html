<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
  <title>Lumen Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="titlebar">
    <div class="tb-brand"><span class="logo"></span>Lumen</div>
    <div class="tb-drag"></div>
    <div class="tb-controls">
      <button id="win-min" title="Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button id="win-max" title="Maximize"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button id="win-close" class="close" title="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
  </div>
  <div id="shell">
    <nav id="sidebar"></nav>
    <main id="view"></main>
  </div>
  <div id="dock"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
