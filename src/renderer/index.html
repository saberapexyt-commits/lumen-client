<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
  <title>Lumen Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell">
    <nav id="sidebar"></nav>
    <main id="view"></main>
  </div>
  <div id="titlebar">
    <div class="tb-controls">
      <button id="win-min" title="Minimize"><svg width="11" height="11" viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button id="win-max" title="Maximize"><svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button id="win-close" class="close" title="Close"><svg width="11" height="11" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>
  <div id="dock"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="splash">
    <img src="assets/logo-full.png" alt="Lumen Client" />
    <div class="bar ind"><i></i></div>
    <div class="st" id="splash-status">STARTING</div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
